
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier de Repaso Autónomo Familiar · ELE A1 · Módulo 1</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#526175; --line:#d7dee8; --control:#8492a5;
  --brand:#2563eb; --brand-d:#1d4ed8; --brand-l:#dbeafe; --focus:#f59e0b;
  --ok:#16a34a; --ok-l:#dcfce7; --bad:#dc2626; --bad-l:#fee2e2;
  --warn:#d97706; --warn-l:#fef3c7; --purple:#7c3aed; --purple-l:#ede9fe;
  --r:14px; --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --sh-lg:0 10px 30px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none !important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:104px}
h1,h2,h3,h4{font-family:ui-serif,Georgia,Cambria,'Times New Roman',serif;line-height:1.25}
p{margin-bottom:.4rem}
small{font-size:.8rem}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- HEADER ---------- */
header.hero{background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 45%,#4f46e5 100%);color:#fff;padding:26px 16px 24px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.16),transparent 45%)}
.hero-in{max-width:1040px;margin:0 auto;text-align:center;position:relative;z-index:1}
.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;color:#eff6ff;margin-bottom:8px}
.hero h1{font-size:clamp(1.6rem,4.2vw,2.7rem);font-weight:700;margin:0}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:600;min-height:44px;padding:10px 18px;border-radius:10px;transition:.18s;text-decoration:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d);transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--control)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 13px;font-size:.875rem;border-radius:8px}
.icon-btn{background:transparent;border:none;cursor:pointer;font-size:1.05rem;color:var(--muted);width:44px;height:44px;padding:6px;border-radius:8px;transition:.15s}
.icon-btn:hover{background:var(--line);color:var(--ink)}

/* ---------- NAV ---------- */
nav.tabs{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(15,23,42,.05)}
.nav-shell{max-width:1040px;margin:0 auto;position:relative;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu-toggle{min-height:44px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:1.5px solid var(--control);border-radius:10px;padding:9px 14px;font:600 .95rem inherit;cursor:pointer;box-shadow:var(--sh);flex:0 0 auto}
.family-toggle{min-height:44px;display:inline-flex;align-items:center;gap:7px;max-width:46vw;background:transparent;color:var(--ink);border:1.5px solid transparent;border-radius:10px;padding:8px 12px;font:600 .9rem inherit;cursor:pointer;overflow:hidden}
.family-toggle:hover{background:#f1f5f9;border-color:var(--line)}
.family-toggle #familyPill{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-toggle:hover{border-color:var(--brand);color:var(--brand-d)}
.menu-toggle[aria-expanded="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.menu-panel{position:absolute;top:calc(100% + 8px);right:12px;width:min(680px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 18px 45px rgba(15,23,42,.18)}
.menu-panel[hidden]{display:none}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.menu-item{width:100%;min-height:44px;display:flex;align-items:center;gap:9px;text-align:left;background:#fff;color:var(--ink);border:1px solid transparent;border-radius:9px;padding:9px 12px;font:600 .95rem inherit;cursor:pointer}
.menu-item:hover{background:#f1f5f9;border-color:var(--line)}
.menu-item.active{background:var(--brand-l);border-color:#93c5fd;color:var(--brand-d)}

/* ---------- CARDS / SECTIONS ---------- */
main{max-width:1040px;margin:0 auto;padding:24px 16px 40px}
.sec-title{font-size:clamp(1.35rem,3vw,1.85rem);font-weight:700;margin-bottom:6px}
.sec-desc{color:var(--muted);font-size:1rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:18px;animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h3{font-size:1.12rem;font-weight:700;margin-bottom:4px}
.card .cons{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--brand-l);color:var(--brand-d)}
.tag.g{background:var(--ok-l);color:#15803d}.tag.o{background:var(--warn-l);color:#b45309}.tag.p{background:var(--purple-l);color:#6d28d9}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:820px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g4,.g5{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc}
.box.blue{background:#eff6ff;border-color:#bfdbfe}.box.amber{background:#fffbeb;border-color:#fde68a}
.box.green{background:#f0fdf4;border-color:#bbf7d0}.box.purple{background:#faf5ff;border-color:#e9d5ff}
.box.red{background:#fef2f2;border-color:#fecaca}

/* ---------- FORM ---------- */
input[type=text],input[type=number],textarea,select{width:100%;min-height:45px;font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1.5px solid var(--control);border-radius:9px;padding:10px 12px;transition:.18s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[readonly]{background:#f8fafc;cursor:default}
textarea{resize:vertical;min-height:110px}
label.lbl{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.chk{width:24px;height:24px;accent-color:var(--brand);cursor:pointer;flex:0 0 auto}
.crit-option{display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}

/* ---------- ITEMS ---------- */
.item{border:1.5px solid var(--line);border-radius:12px;padding:13px;background:#fff;margin-bottom:10px;transition:.2s}
.item:last-child{margin-bottom:0}
.item.ok{background:var(--ok-l);border-color:#86efac}
.item.ko{background:var(--bad-l);border-color:#fca5a5}
.item.pending{background:#f8fafc}
.q{font-size:1rem;font-weight:500;margin-bottom:9px}
.q b{color:var(--brand-d)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{min-height:44px;background:#fff;border:1.5px solid var(--control);border-radius:9px;padding:8px 14px;font-family:inherit;font-size:.95rem;font-weight:500;color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--brand);background:#eff6ff}
.opt.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.opt:disabled{cursor:default;opacity:.75}
.fb{font-size:.79rem;margin-top:9px;padding:7px 10px;border-radius:8px}
.fb.ok{background:#dcfce7;color:#166534}
.fb.ko{background:#fee2e2;color:#991b1b}
.ex-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
.score-chip{font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:999px;background:#f1f5f9;color:var(--muted)}
.score-chip.ok{background:var(--ok-l);color:#15803d}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{background:#f1f5f9;font-weight:700;font-size:.84rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tbl-scroll{overflow-x:auto}
.mini{font-size:.875rem}
.mini td,.mini th{padding:5px 7px}

/* ---------- SYLLABLES ---------- */
.syl-word{font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:7px}
.syls{display:flex;gap:5px;flex-wrap:wrap}
.syl{min-height:44px;border:1.5px solid var(--control);background:#fff;border-radius:8px;padding:7px 13px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s}
.syl:hover{border-color:var(--brand)}
.syl.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.syl.right{background:var(--ok);border-color:var(--ok);color:#fff}
.syl.wrong{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- ACCORDION ---------- */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.acc-head{width:100%;min-height:48px;display:flex;align-items:center;gap:9px;background:#fff;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;color:var(--ink);padding:13px 14px;text-align:left;transition:.15s}
.acc-head:hover{background:#f8fafc}
.acc-head .arw{margin-left:auto;transition:.25s;color:var(--muted);font-size:.75rem}
.acc.open .acc-head .arw{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);background:#fcfdff}
.acc.open .acc-body{display:block;padding-top:12px}

/* ---------- DOMINO ---------- */
.tile{width:100%;border:2px solid #334155;border-radius:12px;background:#fff;overflow:hidden;cursor:pointer;transition:.18s;user-select:none;display:flex;flex-direction:column;font:inherit;color:inherit;text-align:left}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.14)}
.tile .ans{background:#f0fdf4;border-bottom:1px dashed #cbd5e1;padding:8px 10px;font-size:.8rem;font-weight:600;color:#14532d}
.tile .que{padding:8px 10px;font-size:.8rem;color:var(--muted)}
.tile.start{border-color:#f59e0b;background:#fffbeb}
.tile.start .ans{background:#fef3c7;color:#92400e}
.tile.placed{border-color:var(--brand);cursor:default;opacity:.95}
.tile.locked{opacity:.42;cursor:not-allowed}
.tile.locked:hover{transform:none;box-shadow:none}
.chain{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:4px;margin-bottom:14px}
.chain .tile{cursor:default}
.chain .tile:hover{transform:none;box-shadow:none}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px}
.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#4f46e5);border-radius:99px;transition:width .4s ease}

/* ---------- FLIP ---------- */
.flip{width:100%;border:0;padding:0;background:transparent;perspective:900px;cursor:pointer;height:88px;font:inherit;color:inherit;text-align:left}
.flip-in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:11px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;border:1.5px solid}
.flip-f{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.flip-b{background:#f0fdf4;border-color:#bbf7d0;color:#166534;transform:rotateY(180deg)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:100%;max-width:460px;padding:26px;position:relative;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.modal-box h2{font-size:1.45rem;margin-bottom:6px}
.modal-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:none;background:#f1f5f9;cursor:pointer;font-size:1rem;color:var(--muted);transition:.15s}
.modal-x:hover{background:var(--bad-l);color:var(--bad)}
.field{margin-bottom:12px}

/* ---------- SCORE BAR ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(15,23,42,.07);padding:9px 14px}
.dock-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ring{flex:0 0 auto;position:relative;width:46px;height:46px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--ink)}
.chip{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px}
.chip.ok{background:var(--ok-l);color:#15803d}
.chip.ko{background:var(--bad-l);color:#b91c1c}
.dock .spacer{flex:1}
@media(max-width:640px){.dock .lbl-hide{display:none}}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;background:#0f172a;color:#fff;padding:11px 20px;border-radius:999px;font-size:.85rem;font-weight:600;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- MISC ---------- */
.cando-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:#fff;transition:.15s}
.cando-row:hover{border-color:#cbd5e1}
.cando-row .txt{font-size:.92rem;flex:1}
.route-row{align-items:flex-start}
.route-check{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.route-link{min-height:45px;display:flex;align-items:center;gap:6px;width:100%;padding:3px 0;background:transparent;border:0;color:var(--brand-d);font:600 .95rem inherit;text-align:left;cursor:pointer}
.route-link:hover{text-decoration:underline}
.select-choice{width:100%;font:inherit;color:inherit}
.sem{display:flex;gap:5px}
.sem button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:.9rem;transition:.15s;line-height:1}
.sem button:hover{transform:scale(1.1)}
.sem button.on{border-color:currentColor;transform:scale(1.08)}
.sem button[data-c=green].on{background:var(--ok-l);border-color:var(--ok)}
.sem button[data-c=yellow].on{background:var(--warn-l);border-color:var(--warn)}
.sem button[data-c=red].on{background:var(--bad-l);border-color:var(--bad)}
details{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:7px;background:#fff}
summary{padding:10px 12px;font-size:.85rem;font-weight:600;cursor:pointer;background:#f8fafc;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--brand)}
details[open] summary::before{content:"▾ "}
details .body{padding:11px 12px;font-size:.87rem;border-top:1px solid var(--line)}
.role{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;margin-bottom:9px}
.role i{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:.75rem;color:#fff}
ol.steps{padding-left:20px;font-size:.85rem}
ol.steps li{margin-bottom:7px}
.hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.tree-box{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center}
.tree-node{border:2px solid var(--brand);border-radius:11px;background:#fff;padding:9px;min-width:130px;display:flex;flex-direction:column;gap:5px}
.tree-node.pink{border-color:#ec4899}.tree-node.green{border-color:#22c55e}
.arrow{color:#94a3b8;font-size:1.4rem}
@media(max-width:640px){
  .dock .lbl-hide{display:none}
  .dock-in{gap:8px}
  .menu-grid{grid-template-columns:1fr}
  .nav-shell{padding:6px 10px;gap:8px}
  .menu-panel{left:10px;right:10px;width:auto}
  .project-cards{grid-template-columns:1fr!important}
  header.hero{padding:20px 12px 18px}
  .kicker{font-size:.68rem;letter-spacing:.12em;margin-bottom:6px}
  .hero h1{font-size:1.5rem}
  .family-toggle{max-width:44vw;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="hero">
  <div class="hero-in">
    <p class="kicker">Programa ELE A1 · Módulo 1 · Identidad y primeros contactos</p>
    <h1>Repaso Autónomo de la primera clase</h1>
  </div>
</header>

<!-- ============ NAV ============ -->
<nav class="tabs" id="contenido" aria-label="Navegación principal">
  <div class="nav-shell">
    <button class="family-toggle" id="btnOpenSetup" type="button" title="Editar datos de la familia" aria-label="Editar datos de la familia">
      <span aria-hidden="true">👪</span><span id="familyPill">Nuestra familia</span>
    </button>
    <button class="menu-toggle" id="btnMenu" type="button" aria-expanded="false" aria-controls="menuPanel">☰ Contenido</button>
    <div class="menu-panel" id="menuPanel" hidden>
      <div class="menu-grid" id="tabNav">
        <button class="menu-item active" type="button" data-tab="ruta" aria-current="page">📅 Ruta</button>
        <button class="menu-item" type="button" data-tab="herramientas">🧰 Herramientas</button>
        <button class="menu-item" type="button" data-tab="sonidos">🔊 Sonidos</button>
        <button class="menu-item" type="button" data-tab="identidad">🪪 Identidad</button>
        <button class="menu-item" type="button" data-tab="verbos">⚙️ Verbos</button>
        <button class="menu-item" type="button" data-tab="opuestos">↔️ Opuestos</button>
        <button class="menu-item" type="button" data-tab="preguntas">❓ Preguntas</button>
        <button class="menu-item" type="button" data-tab="ortografia">✒️ Ortografía</button>
        <button class="menu-item" type="button" data-tab="juegos">🎲 Juegos</button>
        <button class="menu-item" type="button" data-tab="proyecto">🌳 Proyecto</button>
        <button class="menu-item" type="button" data-tab="autoeval">✅ Autoevaluación</button>
      </div>
    </div>
  </div>
</nav>

<main id="main">
  <section id="tab-ruta" class="tab-pane"></section>
  <section id="tab-herramientas" class="tab-pane hidden"></section>
  <section id="tab-sonidos" class="tab-pane hidden"></section>
  <section id="tab-identidad" class="tab-pane hidden"></section>
  <section id="tab-verbos" class="tab-pane hidden"></section>
  <section id="tab-opuestos" class="tab-pane hidden"></section>
  <section id="tab-preguntas" class="tab-pane hidden"></section>
  <section id="tab-ortografia" class="tab-pane hidden"></section>
  <section id="tab-juegos" class="tab-pane hidden"></section>
  <section id="tab-proyecto" class="tab-pane hidden"></section>
  <section id="tab-autoeval" class="tab-pane hidden"></section>
</main>

<!-- ============ DOCK ============ -->
<div class="dock">
  <div class="dock-in">
    <div class="ring" id="progressRing" role="progressbar" aria-label="Progreso del dossier" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">

const KEY='ele_a1_dossier_v3';
const mem={};
function sGet(k){try{const v=window.localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}}
function sSet(k,v){mem[k]=v;try{window.localStorage.setItem(k,v)}catch(e){}}

function blank(){return{family:'Nuestra familia',members:['Miembro 1','Miembro 2','Miembro 3'],variety:'peninsular',
  answers:{},checked:{},route:{},canDo:{},texts:{},proj:[{},{},{}],errors:[],
  domino:[],spell:[],teacher:false}}
let S=read();
function read(){try{const r=sGet(KEY);if(!r)return blank();const p=JSON.parse(r);const b=blank();const defaults={family:b.family,members:b.members.slice()};const merged=Object.assign(b,p);if(!merged.family)merged.family=defaults.family;if(!Array.isArray(merged.members)||merged.members.length!==3)merged.members=defaults.members.slice();else merged.members=merged.members.map((m,i)=>String(m||'').trim()||defaults.members[i]);return merged}catch(e){return blank()}}
function save(){sSet(KEY,JSON.stringify(S))}

/* ---------- RENDER GENÉRICO DE TAREAS ---------- */
function isDone(id){const c=S.checked[id]||{};const n=TASKS[id].items.length;let k=0;for(let i=0;i<n;i++)if(c[i]!==undefined)k++;return k===n}
function answeredCount(id){const a=S.answers[id]||{};return TASKS[id].items.filter((_,i)=>{const v=a[i];return v!==undefined&&v!==null&&String(v).trim()!==''}).length}

function renderTask(id){
 const T=TASKS[id];const A=S.answers[id]||{};const C=S.checked[id]||{};
 const done=isDone(id);
 let ok=0;Object.values(C).forEach(v=>{if(v===true)ok++});
 let h=`<div class="card" id="task_${id}"><div class="card-head"><div><h3>${T.t}</h3>${done?`<span class="tag g">Corregido · ${ok}/${T.items.length}</span>`:`<span class="tag">${answeredCount(id)}/${T.items.length} respondidas</span>`}</div></div><p class="cons">${T.c}</p>`;

 if(T.type==='choice'){
   h+=`<div>`;T.items.forEach((it,i)=>{
     const st=C[i];const cls=st===true?'ok':st===false?'ko':'pending';
     h+=`<div class="item ${st!==undefined?cls:''}"><p class="q">${i+1}. ${it.q}</p><div class="opts">`;
     it.o.forEach((op,oi)=>{
       h+=`<button type="button" class="opt ${A[i]===oi?'sel':''}" data-opt="${id}|${i}|${oi}" aria-pressed="${A[i]===oi}" ${st!==undefined?'disabled':''}>${op}</button>`;});
     h+=`</div>`;
     if(S.teacher&&st===undefined)h+=`<div class="fb ok">👁️ Clave: <b>${it.o[it.a]}</b> — ${it.r||''}</div>`;
     if(st===true)h+=`<div class="fb ok">✔ ¡Correcto! ${it.r||''}</div>`;
     if(st===false)h+=`<div class="fb ko">✘ La respuesta correcta es <b>${it.o[it.a]}</b>. ${it.r||''}</div>`;
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='fill'){
   h+=`<div class="${T.grid?'grid g'+T.grid:''}">`;T.items.forEach((it,i)=>{
     const st=C[i];const cls=st===true?'ok':st===false?'ko':'pending';
     const label=String(it.q).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
     h+=`<div class="item ${st!==undefined?cls:''}"><p class="q">${T.grid?'':(i+1)+'. '}${it.q}</p>
     <input type="text" id="answer_${id}_${i}" data-fill="${id}|${i}" value="${(A[i]||'').replace(/"/g,'&quot;')}" placeholder="…" aria-label="${label.replace(/"/g,"'")}" ${st!==undefined?'readonly':''}>`;
     if(S.teacher&&st===undefined)h+=`<div class="fb ok">👁️ Clave: <b>${it.a}</b></div>`;
     if(st===false)h+=`<div class="fb ko">✘ Respuesta correcta: <b>${it.a}</b>${it.note?' — '+it.note:''}</div>`;
     if(st===true)h+=`<div class="fb ok">✔ ¡Correcto!${it.note?' '+it.note:''}</div>`;
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='match'){
   h+=`<div class="grid g3">`;T.items.forEach((it,i)=>{
     const st=C[i];const cls=st===true?'ok':st===false?'ko':'pending';
     h+=`<div class="item ${st!==undefined?cls:''}" style="text-align:center"><p class="q" style="margin-bottom:6px"><b>${it.w}</b></p>
     <input type="text" id="answer_${id}_${i}" data-fill="${id}|${i}" value="${(A[i]||'').replace(/"/g,'&quot;')}" placeholder="opuesto…" aria-label="Antónimo de ${it.w}" style="text-align:center" ${st!==undefined?'readonly':''}>`;
     if(st===false)h+=`<div class="fb ko">✘ <b>${it.a}</b></div>`;
     if(st===true)h+=`<div class="fb ok">✔</div>`;
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='spell'){
   h+=`<div class="grid g2">`;T.items.forEach((it,i)=>{
     const st=C[i];const cls=st===true?'ok':st===false?'ko':'pending';
     h+=`<div class="item ${st!==undefined?cls:''}"><p class="q"><b>${it.w}</b></p>
     <input type="text" id="answer_${id}_${i}" data-fill="${id}|${i}" value="${(A[i]||'').replace(/"/g,'&'+'quot;')}" placeholder="eme-a-ene-o" aria-label="Deletrea ${it.w}" ${st!==undefined?'readonly':''}>`;
     if(S.teacher&&st===undefined)h+=`<div class="fb ok">👁️ Clave: <b>${it.a.join('-')}</b></div>`;
     if(st===false)h+=`<div class="fb ko">✘ Revisa el deletreo: <b>${it.a.join('-')}</b></div>`;
     if(st===true)h+=`<div class="fb ok">✔ ¡Deletreo correcto!</div>`;
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='err'){
   h+=`<div>`;T.items.forEach((it,i)=>{
     const st=C[i];
     h+=`<div class="item ${st!==undefined?'ok':'pending'}">
       <p class="q"><span style="color:var(--bad);font-weight:800">✘</span> <i>${it.w}</i></p>
       <input type="text" id="answer_${id}_${i}" data-fill="${id}|${i}" value="${(A[i]||'').replace(/"/g,'&quot;')}" placeholder="Escribe la frase corregida…" aria-label="Corrige la frase: ${it.w.replace(/"/g,"'")}" ${st!==undefined?'readonly':''}>`;
     if(S.teacher&&st===undefined)h+=`<div class="fb ok">👁️ Clave: <b>${it.a}</b></div>`;
     if(st!==undefined){
       const good=st===true;
       h+=`<div class="fb ${good?'ok':'ko'}">${good?'✔ ¡Muy bien!':'✘ Compara con la solución:'} <b>${it.a}</b><br><span style="opacity:.85">${it.r}</span></div>`;}
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='syll'){
   h+=`<div class="grid g4">`;T.items.forEach((it,i)=>{
     const st=C[i];
     h+=`<div class="item ${st===true?'ok':st===false?'ko':'pending'}"><p class="syl-word">${it.w}</p><div class="syls">`;
     it.s.forEach((sy,si)=>{
       let cls='syl';
       if(A[i]===si)cls+=' sel';
       if(st===true&&si===it.a)cls='syl right';
       if(st===false){if(si===it.a)cls='syl right';else if(A[i]===si)cls='syl wrong';}
       h+=`<button type="button" class="${cls}" data-syl="${id}|${i}|${si}" aria-pressed="${A[i]===si}" ${st!==undefined?'disabled':''}>${sy}</button>`;});
     h+=`</div>`;
     if(S.teacher&&st===undefined)h+=`<div class="fb ok">👁️ Clave: <b>${it.s[it.a]}</b></div>`;
     if(st===false)h+=`<div class="fb ko">✘ La sílaba fuerte es <b>${it.s[it.a]}</b>.</div>`;
     h+=`</div>`;});
   h+=`</div>`;
 }
 else if(T.type==='select'){
   h+=`<div class="grid g2">`;T.items.forEach((it,i)=>{
     const st=C[i];const sel=A[i]===true;
     let cls='item '+((st===true)?'ok':(st===false)?'ko':'pending');
     h+=`<button type="button" class="${cls} select-choice" style="display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left" data-sel="${id}|${i}" aria-pressed="${sel}">
       <span style="font-size:1.05rem" aria-hidden="true">${sel?'☑':'☐'}</span><span class="mini" style="flex:1;${sel?'text-decoration:line-through;color:var(--muted)':''}">${it.t}</span></button>`;});
   h+=`</div>`;
   if(Object.keys(C).length){
     h+=`<div class="box green mini" style="margin-top:12px"><b>Solución:</b> sobra el artículo en 1, 2, 3, 4, 5, 6, 8 y 9 (profesiones). Las frases 7 (<i>una francesa</i>) y 10 (<i>unas personas</i>) son correctas: no son profesiones.</div>`;}
 }

 const allAns=T.items.every((_,i)=>{const v=A[i];return T.type==='select'?v!==undefined:(v!==undefined&&String(v).trim()!=='')});
 h+=`<div class="ex-actions">
   <button type="button" class="btn btn-primary btn-sm" data-check="${id}" ${(!allAns||done)?'disabled':''}>Comprobar respuestas</button>
   ${done?`<button type="button" class="btn btn-ghost btn-sm" data-retry="${id}">↺ Reintentar</button>`:''}
   <span class="score-chip ${done?'ok':''}">${done?ok+'/'+T.items.length+' aciertos':answeredCount(id)+'/'+T.items.length+' completadas'}</span>
 </div></div>`;
 return h;
}

 if(n){
   h+=`<p class="mini" style="font-weight:700;color:var(--muted);margin-bottom:6px">CADENA CONSTRUIDA</p><div class="chain">`;

/* ══════════════════════════════════════════════════════════════
   4. LÓGICA DE CORRECCIÓN
   ══════════════════════════════════════════════════════════════ */
function checkTask(id){
 const T=TASKS[id],A=S.answers[id]||{};S.checked[id]=S.checked[id]||{};let ok=0;
 T.items.forEach((it,i)=>{
   let good=false;
   if(T.type==='choice'){good=A[i]===it.a}
   else if(T.type==='syll'){good=A[i]===it.a}
   else if(T.type==='select'){good=(A[i]===true)===it.s}
   else if(T.type==='spell'){
     const toks=String(A[i]||'').split(/[\s\-–—.,;|/]+/).filter(Boolean).map(lnorm);
     good=toks.length===it.a.length&&toks.every((t,k)=>t===lnorm(it.a[k]));
   }
   else{
     const u=norm(A[i]);const acc=[it.a].concat(it.acc||[]).map(norm);good=acc.includes(u);
   }
   S.checked[id][i]=good;if(good)ok++;
 });
 save();refreshTask(id);
 toast(ok===T.items.length?`🎉 ¡Perfecto! ${ok}/${T.items.length}`:`Corregido: ${ok}/${T.items.length} aciertos`);
 updateScore();
}
function retryTask(id){delete S.answers[id];delete S.checked[id];save();refreshTask(id);updateScore()}
function refreshTask(id){
 const el=$('#task_'+id);if(!el)return;
 const tmp=document.createElement('div');tmp.innerHTML=renderTask(id);
 el.replaceWith(tmp.firstElementChild);
}

   verbos:renderVerbos,opuestos:renderOpuestos,preguntas:renderPreguntas,ortografia:renderOrtografia,
   juegos:renderJuegos,proyecto:renderProyecto,autoeval:renderAuto})[name]();
}
function updateScore(){
 let ok=0,ko=0,total=0;
 Object.keys(TASKS).forEach(id=>{const T=TASKS[id],C=S.checked[id]||{};
   T.items.forEach((_,i)=>{total++;if(C[i]===true)ok++;else if(C[i]===false)ko++})});
 $('#nOk').textContent=ok;$('#nKo').textContent=ko;
 const pct=total?Math.round(ok/total*100):0;
 $('#ringTxt').textContent=pct+'%';
 $('#ringFg').style.strokeDashoffset=String(119.4-(119.4*pct/100));
 const ring=$('#progressRing');if(ring)ring.setAttribute('aria-valuenow',String(pct));
}

function setMenuOpen(open){
 const button=$('#btnMenu'),panel=$('#menuPanel');if(!button||!panel)return;
 button.setAttribute('aria-expanded',String(open));panel.hidden=!open;
}
function selectTab(name){
 const button=$(`[data-tab="${name}"]`);if(!button)return;
 $$('.menu-item').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current')});
 button.classList.add('active');button.setAttribute('aria-current','page');
 $$('.tab-pane').forEach(p=>p.classList.add('hidden'));
 const pane=$('#tab-'+name);if(pane)pane.classList.remove('hidden');
 renderSection(name);updateScore();setMenuOpen(false);window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
 const t=e.target;
 const hit=(sel)=>t.closest(sel);

 let el;
 if(el=hit('#btnMenu')){
   const button=$('#btnMenu');setMenuOpen(button.getAttribute('aria-expanded')!=='true');
   return;
 }
 if(el=hit('[data-tab]')){selectTab(el.dataset.tab);return}
 if(el=hit('[data-jump-tab]')){selectTab(el.dataset.jumpTab);return}
 if(el=hit('[data-acc]')){
   const acc=$('#acc'+el.dataset.acc);const open=acc.classList.toggle('open');
   el.setAttribute('aria-expanded',String(open));return;
 }
 if(el=hit('[data-flip]')){const open=el.classList.toggle('on');el.setAttribute('aria-pressed',String(open));return}
 if(el=hit('[data-opt]')){
   const [id,i,o]=el.dataset.opt.split('|');S.answers[id]=S.answers[id]||{};S.answers[id][i]=parseInt(o);
   save();refreshTask(id);return;
 }
 if(el=hit('[data-syl]')){
   const [id,i,s]=el.dataset.syl.split('|');S.answers[id]=S.answers[id]||{};S.answers[id][i]=parseInt(s);
   save();refreshTask(id);return;
 }
 if(el=hit('[data-sel]')){
   const [id,i]=el.dataset.sel.split('|');S.answers[id]=S.answers[id]||{};
   S.answers[id][i]=S.answers[id][i]===true?false:true;save();refreshTask(id);return;
 }
 if(el=hit('[data-check]')){checkTask(el.dataset.check);return}
 if(el=hit('[data-retry]')){retryTask(el.dataset.retry);return}
 if(el=hit('[data-cando]')){
   const [i,c]=el.dataset.cando.split('|');S.canDo[i]=(S.canDo[i]===c?'':c);save();renderAuto();return;
 }
 if(el=hit('[data-spell]')){
   const i=parseInt(el.dataset.spell);const k=S.spell.indexOf(i);
   if(k>=0)S.spell.splice(k,1);else S.spell.push(i);
   save();const selected=el.classList.toggle('sel');el.setAttribute('aria-pressed',String(selected));
   const chip=$('#spellChip');if(chip)chip.textContent=S.spell.length+' / 20';return;
 }
 if(el=hit('[data-dom]')){
   const id=parseInt(el.dataset.dom);const next=S.domino.length+1;
   if(id!==next){toast('Esa ficha todavía no encaja: busca la respuesta a la última pregunta.');return}
   S.domino.push(id);save();renderDom();
   if(S.domino.length===30){toast('🎉 ¡Dominó completado y cerrado!');}
   return;
 }
 if(el=hit('#domReset')){if(confirm('¿Reiniciar la partida de dominó?')){S.domino=[];save();renderDom()}return}
 if(el=hit('#addErr')){S.errors.push({a:'',b:'',c:'',d:0});save();renderAuto();return}
 if(el=hit('#btnTeacher')){S.teacher=!S.teacher;save();el.textContent=S.teacher?'🙈 Ocultar claves':'👁️ Claves';rerenderAll();toast(S.teacher?'Modo profesor activado: claves visibles.':'Modo alumno.');return}
 if(el=hit('#btnReset')){if(confirm('¿Reiniciar TODO el progreso del dossier?')){S=blank();save();location.reload()}return}
 if(!hit('#btnMenu,#menuPanel'))setMenuOpen(false);
});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.route){S.route[t.dataset.route]=t.checked;save();toast(t.checked?'✔ Tarea marcada.':'Tarea desmarcada.');return}
 if(t.dataset&&t.dataset.flag){S.texts['chk_'+t.dataset.flag]=t.checked?'1':'';save();return}
 if(t.dataset&&t.dataset.crit){const [i]=t.dataset.crit.split('|');S.texts['crit'+i]=t.value;save();const el=$('#critTotal');if(el)el.textContent=critTotal();return}
});

document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;if(!d)return;
 if(d.fill){const [id,i]=d.fill.split('|');S.answers[id]=S.answers[id]||{};S.answers[id][i]=t.value;save();
   const card=t.closest('.card');if(card){const chip=card.querySelector('.score-chip');const btn=card.querySelector('[data-check]');
     if(chip&&!isDone(id))chip.textContent=answeredCount(id)+'/'+TASKS[id].items.length+' completadas';
     if(btn){const allAns=TASKS[id].items.every((_,k)=>{const v=(S.answers[id]||{})[k];return v!==undefined&&String(v).trim()!==''});btn.disabled=!allAns||isDone(id)}}
   return}
 if(d.text){S.texts[d.text]=t.value;save();return}
 if(d.proj){const [i,f]=d.proj.split('|');S.proj[i]=S.proj[i]||{};S.proj[i][f]=t.value;save();return}
 if(d.err){const [i,f]=d.err.split('|');while(S.errors.length<=i)S.errors.push({a:'',b:'',c:'',d:0});
   S.errors[i][f]=(f==='d')?(parseInt(t.value)||0):t.value;save();return}
});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
   if($('#btnMenu').getAttribute('aria-expanded')==='true')setMenuOpen(false);
   else closeModal();
 }
 const modal=$('#setupModal');
 if(modal&&!modal.classList.contains('hidden')&&e.key==='Tab'){
   const focusable=[...modal.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null);
   if(focusable.length){
     const first=focusable[0],last=focusable[focusable.length-1];
     if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
     else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
   }
 }
 if(e.key==='Enter'&&modal&&!modal.classList.contains('hidden')){
   const ae=document.activeElement;if(ae&&ae.tagName!=='TEXTAREA'){e.preventDefault();startApp()}
 }
});

/* ══════════════════════════════════════════════════════════════
   6. MODAL + ARRANQUE (a prueba de fallos)
   ══════════════════════════════════════════════════════════════ */
let modalOpener=null;
function setBackgroundInert(value){
 ['header.hero','nav.tabs','main','.dock'].forEach(sel=>{const el=$(sel);if(el)el.inert=value});
}
function closeModal(){
 const m=$('#setupModal');if(!m)return;
 m.classList.add('hidden');m.style.display='none';m.setAttribute('aria-hidden','true');setBackgroundInert(false);
 if(modalOpener&&document.contains(modalOpener))modalOpener.focus();
 modalOpener=null;
}
function openModal(opener){
 const m=$('#setupModal');if(!m)return;
 modalOpener=(opener&&opener.nodeType===1)?opener:document.activeElement;
 $('#familyName').value=S.family||'';
 $('#member1').value=S.members[0]||'';$('#member2').value=S.members[1]||'';$('#member3').value=S.members[2]||'';
 $('#varietySelect').value=S.variety||'peninsular';
 m.classList.remove('hidden');m.style.display='flex';m.removeAttribute('aria-hidden');setBackgroundInert(true);
 setTimeout(()=>{try{$('#familyName').focus()}catch(e){}},60);
}
function startApp(){
 try{
   S.family=($('#familyName').value||'').trim()||'Mi familia';
   S.members=[$('#member1').value.trim(),$('#member2').value.trim(),$('#member3').value.trim()].map((m,i)=>m||('Miembro '+(i+1)));
   S.variety=$('#varietySelect').value;
   save();
 }catch(e){/* nunca bloquear el cierre por un error de datos */}
 closeModal();
 boot();
 toast('👪 Datos de '+S.family+' actualizados. ¡A repasar!');
}

let booted=false;
function boot(){
 $('#familyPill').textContent=S.family||'Nuestra familia';
 $('#btnTeacher').textContent=S.teacher?'🙈 Ocultar claves':'👁️ Claves';
 renderRuta();updateScore();
 // Las demás pestañas se renderizan al abrirlas (ahorra tiempo de carga).
 ['herramientas','sonidos','identidad','verbos','opuestos','preguntas','ortografia','juegos','proyecto','autoeval']
   .forEach(n=>{try{renderSection(n)}catch(err){console.warn(n,err)}});
 booted=true;
}
function rerenderAll(){
 const active=$('.menu-item.active');const name=active?active.dataset.tab:'ruta';
 try{renderSection(name)}catch(e){}
}

$('#btnStart').addEventListener('click',startApp);
$('#btnCloseSetup').addEventListener('click',closeModal);
$('#btnOpenSetup').addEventListener('click',e=>openModal(e.currentTarget));
$('#setupModal').addEventListener('click',e=>{if(e.target.id==='setupModal')closeModal()});

/* Arranque sin modal: el dossier se usa de inmediato y los datos de familia
   se pueden editar desde el encabezado cuando haga falta. */
try{
 boot();
}catch(err){
 console.error(err);
 try{closeModal();boot()}catch(e2){document.body.insertAdjacentHTML('afterbegin','<div style="padding:20px;background:#fee2e2">Error de arranque. Recarga la página.</div>')}
}
</script>
</body>
